<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山东沿海自驾｜12 天 Vlog 拍摄参考片</title><style>
body{font-family:system-ui,"Microsoft YaHei",sans-serif;margin:0;background:#f4f5f5;color:#20262a}main{max-width:1080px;margin:auto;padding:22px}h1{font-size:24px}p{line-height:1.65}.note{background:#e7f1f0;padding:14px;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}.card{background:#fff;padding:15px;border-radius:14px;box-shadow:0 2px 9px #0001}.card h2{font-size:18px;margin:0 0 10px}video{width:100%;max-height:500px;background:#000;border-radius:9px}.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.frames img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px}.frames figure{margin:0}.frames figcaption{text-align:center;font-size:12px;color:#51616b;margin-top:3px}small{color:#5b686d}
</style></head><body><main><h1>12 天 Vlog 拍摄参考片</h1><p class="note">每支约 1 分钟，竖屏、无背景音乐和音效。视频由对应的首帧／中帧／尾帧做成动态分镜参考，帮助你看取景和节奏；它不是真实连续拍摄的旅途录像。实际拍摄仍按旁边的分镜脚本完成，每天只拍当天真实发生的画面。</p><div class="grid" id="list"></div><p><small>独自拍摄时，站稳、用 1×、每段拍 8–12 秒。驾驶时不要操作手机；生成图上的地点标识只作构图参考，以现场为准。</small></p></main><script>
const days=[['01-杭州到日照','9/26 杭州→日照'],['02-日照海边','9/27 日照'],['03-日照到青岛','9/28 日照→青岛'],['04-青岛慢步','9/29 青岛'],['05-青岛到乳山','9/30 青岛→乳山'],['06-威海海滨','10/1 威海'],['07-荣成海岸','10/2 荣成'],['08-烟台一日','10/3 烟台'],['09-淄博烧烤','10/4 淄博'],['10-济南湖泉','10/5 济南'],['11-济南到淮安','10/6 济南→淮安'],['12-平安到家','10/7 淮安→杭州']];
document.getElementById('list').innerHTML=days.map(([id,title])=>{const n=id.slice(0,2);return `<section class="card"><h2>${title}</h2><video controls playsinline preload="metadata" src="视频/${id}.webm"></video><div class="frames">${['首帧','中帧','尾帧'].map(label=>`<figure><a href="图片/${n}-${label}.png"><img loading="lazy" src="图片/${n}-${label}.png" alt="${title}${label}"></a><figcaption>${label}</figcaption></figure>`).join('')}</div></section>`}).join('');
</script></body></html>
